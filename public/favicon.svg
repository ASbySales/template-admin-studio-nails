<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B1233" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Gradiente Dourado Metálico AS -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E0A9" />
      <stop offset="35%" stop-color="#DFB76C" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7730" />
    </linearGradient>

    <!-- Sombra Suave -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados modernos (App Icon) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Borda Sutil Dourada -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Monograma AS Estilizado -->
  <g filter="url(#glow)">
    <!-- Letra A Geométrica Luxo -->
    <path d="M 190 120 L 110 380 L 165 380 L 188 300 L 268 300 L 291 380 L 346 380 L 266 120 Z M 228 175 L 253 255 L 203 255 Z" fill="url(#goldGradient)" />

    <!-- Letra S Dinâmica e Moderna Entrelaçada -->
    <path d="M 390 165 C 375 135 345 120 300 120 C 275 120 255 128 250 135 L 270 170 C 280 162 292 158 305 158 C 325 158 338 165 338 178 C 338 190 328 198 300 208 C 255 224 230 245 230 282 C 230 328 270 355 325 355 C 360 355 388 340 405 320 L 375 285 C 362 298 345 310 325 310 C 305 310 292 300 292 288 C 292 274 305 266 332 256 C 378 240 402 218 402 180 C 402 174 400 169 390 165 Z" fill="url(#goldGradient)" opacity="0.95" />
  </g>

  <!-- Ponto de Destaque / Estrela Guia -->
  <circle cx="395" cy="135" r="10" fill="#F5E0A9" filter="url(#glow)" />
</svg>